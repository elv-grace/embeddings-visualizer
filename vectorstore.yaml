        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get field statistics for a vector index
      tags:
      - Indexes
  /indexes/{qid}/tracks:
    get:
      description: |-
        Returns the distinct vector tracks within the index, along with their vector counts.
        Requires content access for the index qid.
      operationId: vectorstore-get-index-tracks
      parameters:
      - description: Index content ID
        in: path
        name: qid
        required: true
