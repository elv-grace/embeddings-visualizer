        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: List the vector tracks of an index
      tags:
      - Indexes
  /indexes/{qid}/vectors:
    delete:
      description: |-
        Bulk-deletes every vector in the index that was written by a batch with
        the given `model` and whose own `source` is any of the given `sources`.
        Vectors with no batch or no source are never matched. The batch rows
        themselves are kept: a batch may span several sources, so emptying one of
        them does not retire the batch. Vector storage left with no remaining
        vector is garbage-collected; documents and text fields are untouched.
        Requires content access for the index qid.
      operationId: vectorstore-delete-vectors-by-source
      parameters:
      - description: Index content ID
        in: path
        name: qid
        required: true
        type: string
      - description: Model and sources to delete
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/DeleteVectorsBySourceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Delete an index's vectors by model and source
      tags:
      - Vectors
    post:
      description: |-
        Inserts one or more vectors into the given index. Each vector must
        match the index's configured vector dimension. Each may carry an
        `additional_info` object, stored as-is and returned on search hits.
        One request is one write run over one piece of content, so `qid` and
        `batch_id` are given once at the top level and apply to every vector --
        uploading vectors for several contents means one request each. The
        batch must belong to the index in the path and its own content qid
        must agree with `qid`; when `batch_id` is given and `qid` is not, the
        batch supplies it. Both may be omitted: no `batch_id` writes vectors
        that belong to no batch, and no `qid` writes vectors that describe no
        content.
        Requires content access for the index qid.
      operationId: vectorstore-add-vectors
      parameters:
      - description: Index content ID
        in: path
        name: qid
        required: true
        type: string
      - description: Vectors batch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/AddVectorsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Add vectors to an index
      tags:
      - Vectors
